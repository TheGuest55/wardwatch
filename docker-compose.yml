# Reserved for later phases: infusion-pump 172.28.10.32, wearable 172.28.10.33.
name: wardwatch

networks:
  ward_net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-ward
    ipam:
      config:
        - subnet: 172.28.10.0/24

services:
  broker:
    image: eclipse-mosquitto:2.0.22
    command: ["sh", "/mosquitto/config/gen_passwd.sh"]
    environment:
      MQTT_PASS_NURSE_STATION: ${MQTT_PASS_NURSE_STATION:?copy .env.example to .env}
      MQTT_PASS_PATIENT_MONITOR: ${MQTT_PASS_PATIENT_MONITOR:?copy .env.example to .env}
      MQTT_PASS_INFUSION_PUMP: ${MQTT_PASS_INFUSION_PUMP:?copy .env.example to .env}
      MQTT_PASS_WEARABLE: ${MQTT_PASS_WEARABLE:?copy .env.example to .env}
    volumes:
      - ./services/broker:/mosquitto/config:ro
    networks:
      ward_net:
        ipv4_address: 172.28.10.10
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  nurse-station:
    build: ./services/devices
    image: wardwatch-device:0.1.0
    environment:
      DEVICE_ROLE: nurse-station
      MQTT_USERNAME: nurse-station
      MQTT_PASSWORD: ${MQTT_PASS_NURSE_STATION:?copy .env.example to .env}
    depends_on: [broker]
    networks:
      ward_net:
        ipv4_address: 172.28.10.20
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

  patient-monitor:
    build: ./services/devices
    image: wardwatch-device:0.1.0
    environment:
      DEVICE_ROLE: patient-monitor
      MQTT_USERNAME: patient-monitor
      MQTT_PASSWORD: ${MQTT_PASS_PATIENT_MONITOR:?copy .env.example to .env}
      BED: "1"
    volumes:
      - ./data/raw/bidmc:/data/bidmc:ro
    depends_on: [broker]
    networks:
      ward_net:
        ipv4_address: 172.28.10.31
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

  capture:
    build: ./services/capture
    image: wardwatch-capture:0.1.0
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      TZ: UTC
    volumes:
      - ./data/raw/pcap:/data/pcap
    depends_on: [broker]
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped

  attacker:
    build: ./services/attacker
    image: wardwatch-attacker:0.1.0
    cap_add: [NET_RAW, NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      ward_net:
        ipv4_address: 172.28.10.66
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped
